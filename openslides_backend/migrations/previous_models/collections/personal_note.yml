unique_together:
  - meeting_user_id, content_object_id
fields:
  id:
    type: number
    restriction_mode: A
    constant: true
    required: true
  note:
    type: HTMLStrict
    restriction_mode: A
  star:
    type: boolean
    restriction_mode: A
  meeting_user_id:
    type: relation
    reference: meeting_user
    to: meeting_user/personal_note_ids
    equal_fields: meeting_id
    restriction_mode: A
    required: true
    constant: true
  content_object_id:
    type: generic-relation
    reference:
      - motion
    to:
      collections:
        - motion
      field: personal_note_ids
    equal_fields: meeting_id
    required: true
    restriction_mode: A
    constant: true
  meeting_id:
    type: relation
    reference: meeting
    to: meeting/personal_note_ids
    required: true
    restriction_mode: A
    constant: true
